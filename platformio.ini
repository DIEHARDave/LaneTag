; LaneTag: an ESP32 + PN532, RC522 or PN5180 network NFC/RFID filament tag
; reader for 3D printers (formerly zmod_esp32-nfc).
;
; Build and flash:   pio run -e esp32dev -t upload
; Serial monitor:    pio device monitor
;
; Later updates can be uploaded from the web page (Settings > Firmware).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 1.9 MB app slots: room for the web page and OTA updates.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    olikraus/U8g2@2.36.18
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall

; Classic ESP32 dev boards (ESP32-WROOM-32, DOIT DevKit, NodeMCU-32S, ...)
; Also drives the 2.8" touch screen of the ESP32-2432S028 ("Cheap Yellow
; Display") when it is picked under Settings > Display.
[env:esp32dev]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7
build_flags =
    ${env.build_flags}
    -DHAS_TFT=1

; ESP32-2432S028 ("Cheap Yellow Display"): the esp32dev firmware with the
; CYD's screen, PN532 (HSU on the CN1 connector) and LED as defaults.
[env:cyd]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DBOARD_CYD=1

; ESP32-S3 DevKitC and most S3 boards with native USB
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini / DevKitM
[env:esp32-c3]
board = esp32-c3-devkitm-1
; esptool loses the native USB port when it switches to 460800 on some boards.
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C6 DevKitC / SuperMini. Arduino core 2.x has no C6 support, so this
; env alone uses pioarduino's platform (Arduino core 3.x).
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
