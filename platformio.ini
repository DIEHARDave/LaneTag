; zmod_esp32-nfc: an ESP32 + PN532 network NFC reader for Flashforge
; AD5X and Creator 5 printers (stock firmware or Zmod).
;
; Build and flash:   pio run -e esp32dev -t upload
; Serial monitor:    pio device monitor
;
; Later updates can be uploaded from the web page (Settings > Firmware).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 1.9 MB app slots: room for the web page and OTA updates.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall

; Classic ESP32 dev boards (ESP32-WROOM-32, DOIT DevKit, NodeMCU-32S, ...)
[env:esp32dev]
board = esp32dev

; ESP32-S3 DevKitC and most S3 boards with native USB
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini / DevKitM
[env:esp32-c3]
board = esp32-c3-devkitm-1
; esptool loses the native USB port when it switches to 460800 on some boards.
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
